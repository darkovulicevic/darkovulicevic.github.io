<div class="this_content">
    <div class="this_inner">
        <a
            href="https://www.linkedin.com/in/darko-vulicevic/"
            target="_blank"
            rel="noopener noreferrer"
            class="this_badge"
            aria-label="JavaScript Developer at Enreach">
            <span class="this_badge_status" aria-hidden="true">
                <span class="this_badge_dot"></span>
            </span>
            <span class="this_badge_label" aria-hidden="true">
                <span class="this_badge_full">
                    JavaScript Developer at
                    <span class="this_badge_company">Enreach</span>
                </span>
                <span class="this_badge_compact">
                    JS Developer at
                    <span class="this_badge_company">Enreach</span>
                </span>
                <span class="this_badge_mini">
                    JS Dev ·
                    <span class="this_badge_company">Enreach</span>
                </span>
            </span>
        </a>

        <h1 class="this_title" aria-label="Darko Vulicevic">
            <span class="this_word" *ngFor="let word of ui.title" aria-hidden="true">
                <span *ngFor="let item of word.letters" class="this_char" [style.--d.s]="item.d">{{ item.c }}</span>
            </span>
        </h1>

        <h2 class="this_subtitle" aria-label="JavaScript Developer driven by craft, consistency, and technical excellence">
            <span class="this_word" *ngFor="let word of ui.subtitle" aria-hidden="true">
                <span *ngFor="let item of word.letters" class="this_char" [style.--d.s]="item.d">{{ item.c }}</span>
            </span>
        </h2>

        <p class="this_description" aria-label="I build performant, accessible, and visually refined interfaces across Angular and React - with a strong emphasis on architectural integrity, clean code, and sustainable product delivery">
            <span class="this_word" *ngFor="let word of ui.description" aria-hidden="true">
                <span *ngFor="let item of word.letters" class="this_char" [style.--d.s]="item.d">{{ item.c }}</span>
            </span>
        </p>

        <div class="this_actions">
            <a
                href="#projects"
                (click)="scroll($event, 'projects')"
                class="this_action this_action_primary">
                View Projects
            </a>

            <a
                href="#experience"
                (click)="scroll($event, 'experience')"
                class="this_action this_action_secondary">
                Explore Experience
            </a>
        </div>

        <app-nav class="this_nav"></app-nav>
    </div>
</div>
