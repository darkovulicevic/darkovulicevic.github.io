<div class="this_content this_section_shell">
    <header class="this_section_head">
        <p class="this_eyebrow">About</p>
        <p class="this_eyebrow this_role">
            <span class="this_live_dot" aria-hidden="true"></span>
            JavaScript Developer · Enreach Labs
        </p>
        <h2 class="this_section_title">Darko Vulicevic</h2>
        <p class="this_section_subtitle">
            Experienced
            <a
                href="https://www.linkedin.com/in/darko-vulicevic/"
                target="_blank"
                rel="noopener noreferrer"
                class="this_subtitle_link">JavaScript Developer</a>
            with over five years of hands-on expertise in building and maintaining scalable desktop and web applications.
        </p>
    </header>

    <div class="this_grid">
        <article *ngFor="let item of ui.principles" class="this_cell">
            <h3>{{ item.title }}</h3>
            <p>{{ item.body }}</p>
        </article>
    </div>

    <div class="this_strengths">
        <p class="this_eyebrow">Core strengths</p>
        <ul class="this_chips" aria-label="Core strengths">
            <li *ngFor="let item of ui.strengths" class="this_chip">{{ item }}</li>
        </ul>
    </div>
</div>
